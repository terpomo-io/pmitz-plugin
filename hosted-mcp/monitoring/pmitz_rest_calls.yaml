description: "Calls to the REST address of a Pmitz sandbox"
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="pmitz-mcp" AND jsonPayload.usage.event="rest_call"'
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: '1'
  labels:
  - key: client
    valueType: STRING
  - key: resource
    valueType: STRING
labelExtractors:
  client: EXTRACT(jsonPayload.usage.client)
  resource: EXTRACT(jsonPayload.usage.resource)
